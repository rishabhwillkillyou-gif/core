name: Build NES V6 Reference UI

on:
  workflow_dispatch:
  push:
    branches:
      - nes-emulator-v1-build
    paths:
      - ".github/workflows/nes-v6-reference-ui.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout holder repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Clone Lemuroid
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/Swordfish90/Lemuroid.git /tmp/Lemuroid

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Remove notification gate
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("/tmp/Lemuroid/lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/home/HomeViewModel.kt")
          s = p.read_text().replace(
              "showNoNotificationPermissionCard = !notificationsPermissionEnabled",
              "showNoNotificationPermissionCard = false",
          )
          p.write_text(s)

          p = Path("/tmp/Lemuroid/lemuroid-app/src/main/java/com/swordfish/lemuroid/app/shared/GameInteractor.kt")
          s = p.read_text()
          gate = "        if (!ensureNotificationsPermissionAvailable()) {\n            return\n        }\n"
          if s.count(gate) != 2:
              raise SystemExit("Notification gates changed upstream")
          p.write_text(s.replace(gate, ""))
          PY

      - name: Enable FCEUmm turbo for player one
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/Lemuroid/lemuroid-app/src/main/java/com/swordfish/lemuroid/app/shared/game/viewmodel/GameViewModelRetroGameView.kt")
          s = p.read_text()

          old = 'variables = gameData.coreVariables.map { Variable(it.key, it.value) }.toTypedArray()'
          new = '''variables =
                (
                    gameData.coreVariables
                        .filterNot { it.key == "fceumm_turbo_enable" || it.key == "fceumm_turbo_delay" }
                        .map { Variable(it.key, it.value) } +
                        if (system.id == com.swordfish.lemuroid.lib.library.SystemID.NES) {
                            listOf(
                                Variable("fceumm_turbo_enable", "Player 1"),
                                Variable("fceumm_turbo_delay", "2"),
                            )
                        } else {
                            emptyList()
                        }
                ).toTypedArray()'''
          if old not in s:
              raise SystemExit("Core variable init not found")
          s = s.replace(old, new, 1)

          marker = '        retroGameView?.updateVariables(*updatedVariables)'
          addition = '''        retroGameView?.updateVariables(*updatedVariables)

        if (system.id == com.swordfish.lemuroid.lib.library.SystemID.NES) {
            retroGameView?.updateVariables(
                Variable("fceumm_turbo_enable", "Player 1"),
                Variable("fceumm_turbo_delay", "2"),
            )
        }'''
          if marker not in s:
              raise SystemExit("Runtime variable update not found")
          s = s.replace(marker, addition, 1)
          p.write_text(s)
          PY

      - name: Install custom NES controls
        shell: bash
        run: |
          set -euxo pipefail
          cat > /tmp/Lemuroid/lemuroid-touchinput/src/main/java/com/swordfish/touchinput/radial/layouts/NES.kt <<'KOT'
          package com.swordfish.touchinput.radial.layouts

          import android.view.KeyEvent
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.State
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import com.swordfish.touchinput.radial.controls.LemuroidControlCross
          import com.swordfish.touchinput.radial.controls.LemuroidControlFaceButtons
          import com.swordfish.touchinput.radial.layouts.shared.ComposeTouchLayouts
          import com.swordfish.touchinput.radial.layouts.shared.SecondaryButtonMenu
          import com.swordfish.touchinput.radial.settings.TouchControllerSettingsManager
          import gg.padkit.PadKitScope
          import gg.padkit.anchors.Anchor
          import gg.padkit.controls.ControlButton
          import gg.padkit.ids.Id
          import gg.padkit.layouts.radial.secondarydials.LayoutRadialSecondaryDialsScope
          import kotlinx.collections.immutable.persistentListOf
          import kotlinx.collections.immutable.persistentMapOf
          import kotlinx.collections.immutable.persistentSetOf

          private val Olive = Color(0xFF8D9953)
          private val OlivePressed = Color(0xFFAAB86A)
          private val Dark = Color(0xFF111411)
          private val Ring = Color(0xFF252922)
          private val Label = Color(0xFF1B1D19)

          @Composable
          private fun SupDpadBackground() {
              Canvas(modifier = Modifier.fillMaxSize()) {
                  val r = size.minDimension * 0.48f
                  drawCircle(color = Color(0xFF697147), radius = r)
                  drawCircle(
                      color = Color(0xFF32372C),
                      radius = r,
                      style = Stroke(width = 3.dp.toPx()),
                  )

                  val arm = size.minDimension * 0.23f
                  val long = size.minDimension * 0.78f
                  val left = (size.width - long) / 2f
                  val top = (size.height - arm) / 2f
                  drawRoundRect(
                      color = Dark,
                      topLeft = Offset(left, top),
                      size = androidx.compose.ui.geometry.Size(long, arm),
                      cornerRadius = androidx.compose.ui.geometry.CornerRadius(12.dp.toPx()),
                  )
                  val vLeft = (size.width - arm) / 2f
                  val vTop = (size.height - long) / 2f
                  drawRoundRect(
                      color = Dark,
                      topLeft = Offset(vLeft, vTop),
                      size = androidx.compose.ui.geometry.Size(arm, long),
                      cornerRadius = androidx.compose.ui.geometry.CornerRadius(12.dp.toPx()),
                  )
                  drawCircle(color = Color(0xFF20231F), radius = size.minDimension * 0.085f)
              }
          }

          @Composable
          private fun SupDpadForeground(direction: State<Offset>) {
              Canvas(modifier = Modifier.fillMaxSize()) {
                  val active = direction.value
                  val c = if (active != Offset.Zero) Color(0xFFF0F1E8) else Color(0xFF9DA196)
                  val cx = size.width / 2f
                  val cy = size.height / 2f
                  val d = size.minDimension * 0.28f
                  val s = size.minDimension * 0.045f
                  val stroke = 3.dp.toPx()

                  fun chevron(x: Float, y: Float, dx1: Float, dy1: Float, dx2: Float, dy2: Float) {
                      drawLine(c, Offset(x + dx1, y + dy1), Offset(x, y), strokeWidth = stroke)
                      drawLine(c, Offset(x, y), Offset(x + dx2, y + dy2), strokeWidth = stroke)
                  }
                  chevron(cx - d, cy, s, -s, s, s)
                  chevron(cx + d, cy, -s, -s, -s, s)
                  chevron(cx, cy - d, -s, s, s, s)
                  chevron(cx, cy + d, -s, -s, s, -s)
              }
          }

          @Composable
          private fun SupActionButton(
              pressed: State<Boolean>,
              label: String,
              smallLabel: Boolean = false,
          ) {
              Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      val radius = size.minDimension * 0.43f
                      drawCircle(color = Color(0xFF111411), radius = radius * 1.10f)
                      drawCircle(color = Color(0xFF5E6542), radius = radius * 1.02f)
                      drawCircle(color = if (pressed.value) OlivePressed else Olive, radius = radius * 0.90f)
                      drawCircle(
                          color = Color(0xFFBEC88A).copy(alpha = 0.25f),
                          radius = radius * 0.76f,
                          style = Stroke(width = 2.dp.toPx()),
                      )
                  }
                  Text(
                      text = label,
                      color = Label,
                      fontWeight = FontWeight.Black,
                      fontSize =
                          if (smallLabel) {
                              androidx.compose.ui.unit.TextUnit.Unspecified
                          } else {
                              androidx.compose.ui.unit.TextUnit.Unspecified
                          },
                  )
              }
          }

          context(PadKitScope, LayoutRadialSecondaryDialsScope)
          @Composable
          private fun SupPillButton(
              modifier: Modifier,
              id: Id.Key,
              label: String,
          ) {
              ControlButton(
                  modifier = modifier,
                  id = id,
                  background = { },
                  foreground = { pressed ->
                      Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Canvas(modifier = Modifier.fillMaxSize()) {
                              val w = size.width * 0.94f
                              val h = size.height * 0.46f
                              val tl = Offset((size.width - w) / 2f, (size.height - h) / 2f)
                              drawRoundRect(
                                  color = Color(0xFF5A5E52),
                                  topLeft = tl,
                                  size = androidx.compose.ui.geometry.Size(w, h),
                                  cornerRadius = androidx.compose.ui.geometry.CornerRadius(h / 2f),
                              )
                              drawRoundRect(
                                  color = if (pressed.value) Color(0xFF2B2E29) else Color(0xFF101210),
                                  topLeft = Offset(tl.x + 3.dp.toPx(), tl.y + 3.dp.toPx()),
                                  size = androidx.compose.ui.geometry.Size(w - 6.dp.toPx(), h - 6.dp.toPx()),
                                  cornerRadius = androidx.compose.ui.geometry.CornerRadius((h - 6.dp.toPx()) / 2f),
                              )
                          }
                          Text(
                              text = label,
                              color = Color(0xFFE5E5D9),
                              fontWeight = FontWeight.Bold,
                          )
                      }
                  },
              )
          }

          @Composable
          fun PadKitScope.NESLeft(
              modifier: Modifier = Modifier,
              settings: TouchControllerSettingsManager.Settings,
          ) {
              BaseLayoutLeft(
                  settings = settings,
                  modifier = modifier,
                  primaryDial = {
                      LemuroidControlCross(
                          id = Id.DiscreteDirection(ComposeTouchLayouts.MOTION_SOURCE_DPAD),
                          background = { SupDpadBackground() },
                          foreground = { SupDpadForeground(it) },
                      )
                  },
                  secondaryDials = {
                      SupPillButton(
                          modifier = Modifier.radialPosition(315f).radialScale(1.15f),
                          id = Id.Key(KeyEvent.KEYCODE_BUTTON_SELECT),
                          label = "SELECT",
                      )
                  },
              )
          }

          @Composable
          fun PadKitScope.NESRight(
              modifier: Modifier = Modifier,
              settings: TouchControllerSettingsManager.Settings,
          ) {
              BaseLayoutRight(
                  settings = settings,
                  modifier = modifier,
                  primaryDial = {
                      LemuroidControlFaceButtons(
                          primaryAnchors =
                              persistentListOf(
                                  Anchor(
                                      Offset(-0.54f, -0.54f),
                                      persistentSetOf(Id.Key(KeyEvent.KEYCODE_BUTTON_B)),
                                      0.32f,
                                  ),
                                  Anchor(
                                      Offset(0.54f, -0.54f),
                                      persistentSetOf(Id.Key(KeyEvent.KEYCODE_BUTTON_Y)),
                                      0.32f,
                                  ),
                                  Anchor(
                                      Offset(-0.54f, 0.54f),
                                      persistentSetOf(Id.Key(KeyEvent.KEYCODE_BUTTON_A)),
                                      0.32f,
                                  ),
                                  Anchor(
                                      Offset(0.54f, 0.54f),
                                      persistentSetOf(Id.Key(KeyEvent.KEYCODE_BUTTON_X)),
                                      0.32f,
                                  ),
                              ),
                          background = { },
                          applyPadding = false,
                          idsForegrounds =
                              persistentMapOf<Id.Key, @Composable (State<Boolean>) -> Unit>(
                                  Id.Key(KeyEvent.KEYCODE_BUTTON_A) to { SupActionButton(it, "A") },
                                  Id.Key(KeyEvent.KEYCODE_BUTTON_B) to { SupActionButton(it, "B") },
                                  Id.Key(KeyEvent.KEYCODE_BUTTON_X) to { SupActionButton(it, "TURBO A", true) },
                                  Id.Key(KeyEvent.KEYCODE_BUTTON_Y) to { SupActionButton(it, "TURBO B", true) },
                              ),
                      )
                  },
                  secondaryDials = {
                      SupPillButton(
                          modifier = Modifier.radialPosition(225f).radialScale(1.15f),
                          id = Id.Key(KeyEvent.KEYCODE_BUTTON_START),
                          label = "START",
                      )
                      SecondaryButtonMenu(settings)
                  },
              )
          }
          KOT

      - name: Build reference-style handheld shell
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Screen / control positioning.
          p = Path("/tmp/Lemuroid/lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/game/GameScreenLayout.kt")
          s = p.read_text()
          s = s.replace(
              "import androidx.constraintlayout.compose.Dimension",
              "import androidx.constraintlayout.compose.Dimension\nimport androidx.compose.ui.unit.dp",
              1,
          )
          s = s.replace(
              '    const val CONSTRAINTS_GAME_VIEW = "gameView"',
              '    const val CONSTRAINTS_GAME_VIEW = "gameView"\n    const val CONSTRAINTS_GAME_BEZEL = "gameBezel"',
              1,
          )

          old = """            val gameView = createRefFor(CONSTRAINTS_GAME_VIEW)
              val leftPad = createRefFor(CONSTRAINTS_LEFT_PAD)
              val rightPad = createRefFor(CONSTRAINTS_RIGHT_PAD)
              val gameContainer = createRefFor(CONSTRAINTS_GAME_CONTAINER)
              val bottomContainer = createRefFor(CONSTRAINTS_BOTTOM_CONTAINER)

              val gamePadChain = createHorizontalChain(leftPad, rightPad, chainStyle = ChainStyle.SpreadInside)

              constrain(gameView) {
                  width = Dimension.fillToConstraints
                  height = Dimension.fillToConstraints
                  top.linkTo(parent.top)
                  absoluteLeft.linkTo(parent.absoluteLeft)
                  absoluteRight.linkTo(parent.absoluteRight)
                  bottom.linkTo(leftPad.top)
              }"""
          new = """            val gameView = createRefFor(CONSTRAINTS_GAME_VIEW)
              val gameBezel = createRefFor(CONSTRAINTS_GAME_BEZEL)
              val leftPad = createRefFor(CONSTRAINTS_LEFT_PAD)
              val rightPad = createRefFor(CONSTRAINTS_RIGHT_PAD)
              val gameContainer = createRefFor(CONSTRAINTS_GAME_CONTAINER)
              val bottomContainer = createRefFor(CONSTRAINTS_BOTTOM_CONTAINER)

              val gamePadChain = createHorizontalChain(leftPad, rightPad, chainStyle = ChainStyle.SpreadInside)

              constrain(gameBezel) {
                  width = Dimension.fillToConstraints
                  height = Dimension.ratio("6:5")
                  top.linkTo(parent.top, margin = 4.dp)
                  absoluteLeft.linkTo(parent.absoluteLeft, margin = 4.dp)
                  absoluteRight.linkTo(parent.absoluteRight, margin = 4.dp)
              }

              constrain(gameView) {
                  width = Dimension.fillToConstraints
                  height = Dimension.ratio("4:3")
                  top.linkTo(gameBezel.top, margin = 30.dp)
                  absoluteLeft.linkTo(gameBezel.absoluteLeft, margin = 12.dp)
                  absoluteRight.linkTo(gameBezel.absoluteRight, margin = 12.dp)
              }"""
          if old not in s:
              raise SystemExit("Portrait screen constraints not found")
          s = s.replace(old, new, 1)

          s = s.replace(
              "                top.linkTo(leftPad.top)",
              "                top.linkTo(gameBezel.bottom)",
              1,
          )

          old = """            constrain(rightPad) {
                  width = Dimension.fillToConstraints
                  bottom.linkTo(parent.bottom)
              }

              constrain(leftPad) {
                  width = Dimension.fillToConstraints
                  bottom.linkTo(parent.bottom)
              }"""
          new = """            constrain(rightPad) {
                  width = Dimension.fillToConstraints
                  top.linkTo(gameBezel.bottom, margin = 4.dp)
                  bottom.linkTo(parent.bottom, margin = 72.dp)
                  verticalBias = 0.20f
              }

              constrain(leftPad) {
                  width = Dimension.fillToConstraints
                  top.linkTo(gameBezel.bottom, margin = 4.dp)
                  bottom.linkTo(parent.bottom, margin = 72.dp)
                  verticalBias = 0.20f
              }"""
          if old not in s:
              raise SystemExit("Portrait pad constraints not found")
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Handheld bezel + completed lower deck details.
          p = Path("/tmp/Lemuroid/lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/game/MobileGameScreen.kt")
          s = p.read_text()

          imports = {
              "import androidx.compose.foundation.layout.Arrangement":
                  "import androidx.compose.foundation.Canvas\nimport androidx.compose.foundation.layout.Arrangement",
              "import androidx.compose.ui.draw.rotate":
                  "import androidx.compose.ui.draw.rotate\nimport androidx.compose.ui.draw.drawBehind",
              "import androidx.compose.ui.geometry.Rect":
                  "import androidx.compose.ui.geometry.Rect\nimport androidx.compose.ui.geometry.Offset\nimport androidx.compose.ui.geometry.Size",
              "import androidx.compose.ui.graphics.vector.ImageVector":
                  "import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.graphics.vector.ImageVector",
          }
          for old_i, new_i in imports.items():
              if old_i not in s:
                  raise SystemExit(f"Import anchor missing: {old_i}")
              s = s.replace(old_i, new_i, 1)

          viewport = ".layoutId(GameScreenLayout.CONSTRAINTS_GAME_VIEW)"
          idx = s.find(viewport)
          if idx < 0:
              raise SystemExit("Viewport not found")
          box_idx = s.rfind("                Box(", 0, idx)
          if box_idx < 0:
              raise SystemExit("Viewport Box not found")

          bezel = """                if (!isLandscape) {
                      Box(
                          modifier =
                              Modifier
                                  .layoutId(GameScreenLayout.CONSTRAINTS_GAME_BEZEL)
                                  .drawBehind {
                                      val olive = Color(0xFF5E6342)
                                      val dark = Color(0xFF20241F)
                                      val black = Color(0xFF111310)
                                      val screw = Color(0xFF252720)

                                      val outer = 8.dp.toPx()
                                      val inner = 10.dp.toPx()
                                      val topBand = 28.dp.toPx()
                                      val bottomBand = 28.dp.toPx()

                                      // Olive external frame.
                                      drawRect(olive, Offset.Zero, Size(size.width, topBand))
                                      drawRect(olive, Offset(0f, size.height - bottomBand), Size(size.width, bottomBand))
                                      drawRect(olive, Offset(0f, topBand), Size(outer, size.height - topBand - bottomBand))
                                      drawRect(olive, Offset(size.width - outer, topBand), Size(outer, size.height - topBand - bottomBand))

                                      // Dark inner surround.
                                      drawRect(dark, Offset(outer, topBand), Size(inner, size.height - topBand - bottomBand))
                                      drawRect(dark, Offset(size.width - outer - inner, topBand), Size(inner, size.height - topBand - bottomBand))
                                      drawRect(dark, Offset(outer, topBand), Size(size.width - outer * 2f, inner))
                                      drawRect(dark, Offset(outer, size.height - bottomBand - inner), Size(size.width - outer * 2f, inner))

                                      // Corner screws.
                                      val sr = 6.dp.toPx()
                                      listOf(
                                          Offset(12.dp.toPx(), 12.dp.toPx()),
                                          Offset(size.width - 12.dp.toPx(), 12.dp.toPx()),
                                          Offset(12.dp.toPx(), size.height - 12.dp.toPx()),
                                          Offset(size.width - 12.dp.toPx(), size.height - 12.dp.toPx()),
                                      ).forEach {
                                          drawCircle(screw, sr, it)
                                          drawLine(Color.Black, it - Offset(sr * .45f, 0f), it + Offset(sr * .45f, 0f), 1.5.dp.toPx())
                                      }

                                      // Status lamps left.
                                      drawCircle(Color(0xFF75D84A), 5.dp.toPx(), Offset(18.dp.toPx(), 82.dp.toPx()))
                                      drawCircle(Color(0xFFCECC9A), 5.dp.toPx(), Offset(18.dp.toPx(), 104.dp.toPx()))

                                      // Small speaker perforations right.
                                      val px = 4.dp.toPx()
                                      for (row in 0..8) {
                                          for (col in 0..1) {
                                              drawCircle(
                                                  black,
                                                  2.dp.toPx(),
                                                  Offset(
                                                      size.width - 18.dp.toPx() + col * 8.dp.toPx(),
                                                      72.dp.toPx() + row * 12.dp.toPx(),
                                                  ),
                                              )
                                          }
                                      }
                                  },
                      )
                  }

          """
          s = s[:box_idx] + bezel + s[box_idx:]

          p.write_text(s)

          # Lower deck: warm grey body with LEDs, top speaker and venting.
          p = Path("/tmp/Lemuroid/lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/game/MobileGameScreen.kt")
          s = p.read_text()
          old_pad = """private fun PadContainer(modifier: Modifier = Modifier) {
              val theme = LocalLemuroidPadTheme.current
              GlassSurface(
                  modifier = modifier,
                  cornerRadius = theme.level0CornerRadius,
                  fillColor = theme.level0Fill,
                  shadowColor = theme.level0Shadow,
                  shadowWidth = theme.level0ShadowWidth,
              )
          }"""
          new_pad = """private fun PadContainer(modifier: Modifier = Modifier) {
              GlassSurface(
                  modifier = modifier,
                  cornerRadius = 18.dp,
                  fillColor = Color(0xFFB2B0A7),
                  shadowColor = Color.Black.copy(alpha = 0.22f),
                  shadowWidth = 3.dp,
              ) {
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      val olive = Color(0xFF626847)
                      val dark = Color(0xFF363A31)

                      // Slim olive header strip tying the deck into the bezel.
                      drawRect(olive, Offset.Zero, Size(size.width, 24.dp.toPx()))

                      // Three indicator lamps.
                      drawCircle(Color(0xFF6AC34D), 5.dp.toPx(), Offset(size.width * 0.60f, 42.dp.toPx()))
                      drawCircle(Color(0xFF4A5135), 5.dp.toPx(), Offset(size.width * 0.65f, 42.dp.toPx()))
                      drawCircle(Color(0xFF4A5135), 5.dp.toPx(), Offset(size.width * 0.70f, 42.dp.toPx()))

                      // Upper-right speaker grid.
                      for (row in 0..4) {
                          for (col in 0..5) {
                              drawCircle(
                                  dark,
                                  2.3.dp.toPx(),
                                  Offset(
                                      size.width * 0.80f + col * 9.dp.toPx(),
                                      30.dp.toPx() + row * 9.dp.toPx(),
                                  ),
                              )
                          }
                      }

                      // Bottom diagonal vents.
                      val baseY = size.height - 58.dp.toPx()
                      for (i in 0..6) {
                          val x1 = 22.dp.toPx() + i * 10.dp.toPx()
                          drawLine(
                              olive,
                              Offset(x1, baseY),
                              Offset(x1 + 28.dp.toPx(), size.height - 18.dp.toPx()),
                              strokeWidth = 5.dp.toPx(),
                          )
                          val xr = size.width - 22.dp.toPx() - i * 10.dp.toPx()
                          drawLine(
                              olive,
                              Offset(xr, baseY),
                              Offset(xr - 28.dp.toPx(), size.height - 18.dp.toPx()),
                              strokeWidth = 5.dp.toPx(),
                          )
                      }

                      // Lower centre marker and tiny perforations.
                      val cx = size.width / 2f
                      drawLine(olive, Offset(cx - 12.dp.toPx(), size.height - 26.dp.toPx()), Offset(cx, size.height - 10.dp.toPx()), 3.dp.toPx())
                      drawLine(olive, Offset(cx, size.height - 10.dp.toPx()), Offset(cx + 12.dp.toPx(), size.height - 26.dp.toPx()), 3.dp.toPx())
                  }
              }
          }"""
          if old_pad not in s:
              raise SystemExit("PadContainer function not found")
          s = s.replace(old_pad, new_pad, 1)
          p.write_text(s)

          # Sharp pixel scaling remains default.
          p = Path("/tmp/Lemuroid/lemuroid-app/src/main/java/com/swordfish/lemuroid/app/shared/game/ShaderChooser.kt")
          s = p.read_text().replace("SystemID.NES -> ShaderConfig.CRT", "SystemID.NES -> ShaderConfig.Sharp")
          p.write_text(s)
          PY

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/Lemuroid
          chmod +x gradlew
          ./gradlew :lemuroid-app:assembleFreeDynamicDebug --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find /tmp/Lemuroid/lemuroid-app/build/outputs/apk -type f -name "*.apk" | head -n 1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/NESMultiplayer-V6-Reference-UI.apk"
          ls -lh "$GITHUB_WORKSPACE/NESMultiplayer-V6-Reference-UI.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NESMultiplayer-V6-Reference-UI
          path: NESMultiplayer-V6-Reference-UI.apk
          if-no-files-found: error
          retention-days: 7
