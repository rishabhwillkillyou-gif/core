name: Publish RishiDM v0.5 In-App Video Preview

on:
  push:
    branches: [rishidm-v05-integrated-video]
    paths:
      - '.github/workflows/rishidm-v05-publish.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Retrieve compiled RishiDM installer
        uses: actions/download-artifact@v4
        with:
          name: RishiDM-v0.5-In-App-Video-Preview
          run-id: 41210895645
          github-token: ${{ github.token }}
          path: installer
      - name: Verify Windows installer
        shell: bash
        run: |
          set -euo pipefail
          exe=installer/RishiDM_Setup_0.5.0_x64.exe
          test -f "$exe"
          test "$(stat -c %s "$exe")" -gt 180000000
          test "$(head -c2 "$exe")" = "MZ"
          sha256sum "$exe" | tee installer/SHA256SUMS.txt
      - name: Publish untested v0.5 preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=rishidm-v0.5.0-preview
          exe=installer/RishiDM_Setup_0.5.0_x64.exe
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite."
            exit 1
          fi
          cat > RELEASE_NOTES.txt <<'EOF'
          RishiDM v0.5.0 — Experimental In-App Video Queue

          CHANGES
          - Browser "Download video with RishiDM" now sends the job through the desktop IPC service into the running main application, rather than opening the separate PowerShell window.
          - Video downloads appear in a compact pane above the standard RishiDM file list, with progress, 4K/1080p/720p/Best choices and cancel/retry.
          - Video task history saved in the user's local RishiDM profile, with interrupted tasks marked for manual resume.
          - yt-dlp process exit status tracked directly to address false 'failed' status after successful FFmpeg merge.
          - Normal HTTP/segmented downloads, Chrome integration and bundled yt-dlp/Deno/FFmpeg retained.

          LIMITATIONS
          - This is NOT a fully unified AB-download-list backend yet; video jobs appear in their own section of the MAIN window.
          - Video jobs still require user quality selection in the RishiDM main window.
          - The legacy video helper shortcut can still exist from earlier installations.
          - The YouTube floating button remains site-specific; embedded players such as Autoembed may not have a button.
          - Unsupported third-party player URLs returning HTTP 404 remain unsupported. No DRM bypass or unauthorized stream interception.
          - Windows build passed, but real UI and browser IPC behavior are NOT YET tested on a user's Windows machine.
          - Installer is unsigned. Keep v0.4 available for rollback. Download only authorized/unprotected media.

          Source: https://github.com/rishabhwillkillyou-gif/core/tree/rishidm-v05-integrated-video
          Build: https://github.com/rishabhwillkillyou-gif/core/actions/runs/41210895645
          EOF
          gh release create "$tag" "$exe" installer/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target rishidm-v05-integrated-video \
            --title 'RishiDM v0.5.0 — Integrated Video Queue Preview' \
            --prerelease --notes-file RELEASE_NOTES.txt
