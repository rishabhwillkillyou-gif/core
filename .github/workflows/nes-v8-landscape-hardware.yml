name: Build NES V8.1 Landscape Embedded

on:
  workflow_dispatch:
  push:
    branches:
      - nes-emulator-v1-build
    paths:
      - ".github/workflows/nes-v8-landscape-hardware.yml"
      - "nes-v6/**"
      - "nes-v8/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout holder repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Clone Lemuroid
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/Swordfish90/Lemuroid.git /tmp/Lemuroid

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Apply latest portrait baseline
        shell: bash
        run: |
          set -euxo pipefail
          cp "$GITHUB_WORKSPACE/nes-v6/NES.kt" /tmp/Lemuroid/lemuroid-touchinput/src/main/java/com/swordfish/touchinput/radial/layouts/NES.kt
          python3 "$GITHUB_WORKSPACE/nes-v6/patch.py" /tmp/Lemuroid

      - name: Apply landscape hardware mode
        shell: bash
        run: |
          set -euxo pipefail
          cp "$GITHUB_WORKSPACE/nes-v8/NESLandscapeHardware.kt" /tmp/Lemuroid/lemuroid-touchinput/src/main/java/com/swordfish/touchinput/radial/layouts/NESLandscapeHardware.kt
          python3 "$GITHUB_WORKSPACE/nes-v8/patch_landscape.py" /tmp/Lemuroid

      - name: Inject bundled FCEUmm NES core
        shell: bash
        run: |
          set -euxo pipefail
          ROOT=/tmp/Lemuroid/lemuroid-cores/bundled-cores/src/main/jniLibs
          rm -rf "$ROOT"
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            mkdir -p "$ROOT/$ABI"
            curl -fL --retry 3 \
              -o "$ROOT/$ABI/libfceumm_libretro_android.so" \
              "https://raw.githubusercontent.com/Swordfish90/LemuroidCores/master/lemuroid_core_fceumm/src/main/jniLibs/$ABI/libfceumm_libretro_android.so"
          done
          echo "Bundled NES core files:"
          find "$ROOT" -type f -name "libfceumm_libretro_android.so" -print -exec ls -lh {} \;
          COUNT="$(find "$ROOT" -type f -name "libfceumm_libretro_android.so" | wc -l)"
          test "$COUNT" -eq 4

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/Lemuroid
          chmod +x gradlew
          ./gradlew :lemuroid-app:assembleFreeBundleDebug --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find /tmp/Lemuroid/lemuroid-app/build/outputs/apk -type f -name "*.apk" | head -n 1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/NESMultiplayer-V8.1-Landscape-Embedded.apk"
          ls -lh "$GITHUB_WORKSPACE/NESMultiplayer-V8.1-Landscape-Embedded.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NESMultiplayer-V8.1-Landscape-Embedded
          path: NESMultiplayer-V8.1-Landscape-Embedded.apk
          if-no-files-found: error
          retention-days: 7
