name: Build NES V8 Landscape Hardware

on:
  workflow_dispatch:
  push:
    branches:
      - nes-emulator-v1-build
    paths:
      - ".github/workflows/nes-v8-landscape-hardware.yml"
      - "nes-v6/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout holder repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Clone Lemuroid
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/Swordfish90/Lemuroid.git /tmp/Lemuroid

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Apply final portrait sources
        shell: bash
        run: |
          set -euxo pipefail
          cp "$GITHUB_WORKSPACE/nes-v6/NES.kt" /tmp/Lemuroid/lemuroid-touchinput/src/main/java/com/swordfish/touchinput/radial/layouts/NES.kt
          python3 "$GITHUB_WORKSPACE/nes-v6/patch.py" /tmp/Lemuroid

      - name: Apply landscape hardware-shell mode
        shell: bash
        run: |
          set -euxo pipefail

          cat > /tmp/Lemuroid/lemuroid-touchinput/src/main/java/com/swordfish/touchinput/radial/layouts/NESLandscapeHardware.kt <<'KOT'
          package com.swordfish.touchinput.radial.layouts

          import android.view.KeyEvent
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.Spacer
          import androidx.compose.foundation.layout.fillMaxHeight
          import androidx.compose.foundation.layout.height
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.layout.size
          import androidx.compose.foundation.layout.width
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.State
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.unit.dp
          import com.swordfish.touchinput.radial.controls.LemuroidControlCross
          import com.swordfish.touchinput.radial.controls.LemuroidControlFaceButtons
          import com.swordfish.touchinput.radial.layouts.shared.ComposeTouchLayouts
          import com.swordfish.touchinput.radial.ui.LemuroidButtonForeground
          import com.swordfish.touchinput.radial.ui.LemuroidControlBackground
          import gg.padkit.PadKitScope
          import gg.padkit.anchors.Anchor
          import gg.padkit.controls.ControlButton
          import gg.padkit.ids.Id
          import kotlinx.collections.immutable.persistentListOf
          import kotlinx.collections.immutable.persistentMapOf
          import kotlinx.collections.immutable.persistentSetOf

          context(PadKitScope)
          @Composable
          fun NESLandscapeHardwareLeft(modifier: Modifier = Modifier) {
              Column(
                  modifier =
                      modifier
                          .width(156.dp)
                          .fillMaxHeight()
                          .padding(horizontal = 10.dp, vertical = 10.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center,
              ) {
                  LemuroidControlCross(
                      modifier = Modifier.size(134.dp),
                      id = Id.DiscreteDirection(ComposeTouchLayouts.MOTION_SOURCE_DPAD),
                  )

                  Spacer(modifier = Modifier.height(12.dp))

                  NESLandscapeHardwareButton(
                      modifier = Modifier.width(106.dp).height(38.dp),
                      id = Id.Key(KeyEvent.KEYCODE_BUTTON_SELECT),
                      label = "SELECT",
                  )
              }
          }

          context(PadKitScope)
          @Composable
          fun NESLandscapeHardwareRight(modifier: Modifier = Modifier) {
              Column(
                  modifier =
                      modifier
                          .width(156.dp)
                          .fillMaxHeight()
                          .padding(horizontal = 10.dp, vertical = 10.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center,
              ) {
                  LemuroidControlFaceButtons(
                      modifier = Modifier.size(144.dp),
                      primaryAnchors =
                          persistentListOf(
                              Anchor(
                                  Offset(-0.54f, -0.54f),
                                  persistentSetOf(Id.Key(KeyEvent.KEYCODE_BUTTON_B)),
                                  0.36f,
                              ),
                              Anchor(
                                  Offset(0.54f, -0.54f),
                                  persistentSetOf(Id.Key(KeyEvent.KEYCODE_BUTTON_Y)),
                                  0.36f,
                              ),
                              Anchor(
                                  Offset(-0.54f, 0.54f),
                                  persistentSetOf(Id.Key(KeyEvent.KEYCODE_BUTTON_A)),
                                  0.36f,
                              ),
                              Anchor(
                                  Offset(0.54f, 0.54f),
                                  persistentSetOf(Id.Key(KeyEvent.KEYCODE_BUTTON_X)),
                                  0.36f,
                              ),
                          ),
                      idsForegrounds =
                          persistentMapOf<Id.Key, @Composable (State<Boolean>) -> Unit>(
                              Id.Key(KeyEvent.KEYCODE_BUTTON_B) to {
                                  LemuroidButtonForeground(pressed = it, label = "B")
                              },
                              Id.Key(KeyEvent.KEYCODE_BUTTON_Y) to {
                                  LemuroidButtonForeground(pressed = it, label = "TB")
                              },
                              Id.Key(KeyEvent.KEYCODE_BUTTON_A) to {
                                  LemuroidButtonForeground(pressed = it, label = "A")
                              },
                              Id.Key(KeyEvent.KEYCODE_BUTTON_X) to {
                                  LemuroidButtonForeground(pressed = it, label = "TA")
                              },
                          ),
                  )

                  Spacer(modifier = Modifier.height(12.dp))

                  NESLandscapeHardwareButton(
                      modifier = Modifier.width(106.dp).height(38.dp),
                      id = Id.Key(KeyEvent.KEYCODE_BUTTON_START),
                      label = "START",
                  )

                  Spacer(modifier = Modifier.height(6.dp))

                  NESLandscapeHardwareButton(
                      modifier = Modifier.width(44.dp).height(34.dp),
                      id = Id.Key(KeyEvent.KEYCODE_BUTTON_MODE),
                      label = "≡",
                  )
              }
          }

          context(PadKitScope)
          @Composable
          private fun NESLandscapeHardwareButton(
              modifier: Modifier,
              id: Id.Key,
              label: String,
          ) {
              ControlButton(
                  modifier = modifier,
                  id = id,
                  foreground = {
                      LemuroidButtonForeground(
                          pressed = it,
                          label = label,
                      )
                  },
                  background = { LemuroidControlBackground() },
              )
          }
          KOT

          python3 - <<'PY'
          from pathlib import Path

          p = Path("/tmp/Lemuroid/lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/game/MobileGameScreen.kt")
          s = p.read_text()

          if "NESLandscapeHardwareLeft" not in s:
              s = s.replace(
                  "import com.swordfish.touchinput.radial.LocalLemuroidPadTheme",
                  "import com.swordfish.touchinput.radial.LocalLemuroidPadTheme\n"
                  "import com.swordfish.touchinput.radial.layouts.NESLandscapeHardwareLeft\n"
                  "import com.swordfish.touchinput.radial.layouts.NESLandscapeHardwareRight",
                  1,
              )

          constraint_token = "currentControllerConfig?.allowTouchOverlay ?: true"
          if constraint_token not in s:
              raise SystemExit("Constraint selection token not found")
          s = s.replace(
              constraint_token,
              "if (isLandscape) false else currentControllerConfig?.allowTouchOverlay ?: true",
              1,
          )

          old_controls = '''                        if (!isLandscape) {
                              PadContainer(
                                  modifier = Modifier.layoutId(GameScreenLayout.CONSTRAINTS_BOTTOM_CONTAINER),
                              )
                          } else if (!currentControllerConfig.allowTouchOverlay) {
                              PadContainer(
                                  modifier = Modifier.layoutId(GameScreenLayout.CONSTRAINTS_LEFT_CONTAINER),
                              )
                              PadContainer(
                                  modifier = Modifier.layoutId(GameScreenLayout.CONSTRAINTS_RIGHT_CONTAINER),
                              )
                          }

                          leftGamePad?.invoke(
                              this,
                              Modifier.layoutId(GameScreenLayout.CONSTRAINTS_LEFT_PAD),
                              touchControllerSettings,
                          )
                          rightGamePad?.invoke(
                              this,
                              Modifier.layoutId(GameScreenLayout.CONSTRAINTS_RIGHT_PAD),
                              touchControllerSettings,
                          )'''

          new_controls = '''                        if (!isLandscape) {
                              PadContainer(
                                  modifier = Modifier.layoutId(GameScreenLayout.CONSTRAINTS_BOTTOM_CONTAINER),
                              )
                          } else {
                              LandscapeHardwarePanel(
                                  modifier = Modifier.layoutId(GameScreenLayout.CONSTRAINTS_LEFT_CONTAINER),
                                  rightSide = false,
                              )
                              LandscapeHardwarePanel(
                                  modifier = Modifier.layoutId(GameScreenLayout.CONSTRAINTS_RIGHT_CONTAINER),
                                  rightSide = true,
                              )
                          }

                          if (isLandscape) {
                              NESLandscapeHardwareLeft(
                                  modifier = Modifier.layoutId(GameScreenLayout.CONSTRAINTS_LEFT_PAD),
                              )
                              NESLandscapeHardwareRight(
                                  modifier = Modifier.layoutId(GameScreenLayout.CONSTRAINTS_RIGHT_PAD),
                              )
                          } else {
                              leftGamePad?.invoke(
                                  this,
                                  Modifier.layoutId(GameScreenLayout.CONSTRAINTS_LEFT_PAD),
                                  touchControllerSettings,
                              )
                              rightGamePad?.invoke(
                                  this,
                                  Modifier.layoutId(GameScreenLayout.CONSTRAINTS_RIGHT_PAD),
                                  touchControllerSettings,
                              )
                          }'''

          if old_controls not in s:
              raise SystemExit("Control rendering block not found")
          s = s.replace(old_controls, new_controls, 1)

          viewport = '''                        .layoutId(GameScreenLayout.CONSTRAINTS_GAME_VIEW)
                              .windowInsetsPadding(WindowInsets.displayCutout.only(WindowInsetsSides.Top))
                              .onGloballyPositioned { viewportPosition.value = it.boundsInRoot() },'''
          viewport_new = '''                        .layoutId(GameScreenLayout.CONSTRAINTS_GAME_VIEW)
                              .then(
                                  if (isLandscape) {
                                      Modifier.border(
                                          width = 3.dp,
                                          color = Color(0xFF171A12),
                                          shape = RoundedCornerShape(8.dp),
                                      )
                                  } else {
                                      Modifier
                                  },
                              )
                              .windowInsetsPadding(WindowInsets.displayCutout.only(WindowInsetsSides.Top))
                              .onGloballyPositioned { viewportPosition.value = it.boundsInRoot() },'''
          if viewport not in s:
              raise SystemExit("Viewport modifier block not found")
          s = s.replace(viewport, viewport_new, 1)

          insert_point = "@Composable\nprivate fun PadContainer"
          hardware_fn = '''@Composable
          private fun LandscapeHardwarePanel(
              modifier: Modifier = Modifier,
              rightSide: Boolean,
          ) {
              val body = Color(0xFF666A49)
              val edge = Color(0xFF24261B)
              val detail = Color(0xFF303325)
              val led = Color(0xFF8FEA35)

              Box(
                  modifier =
                      modifier
                          .drawBehind {
                              drawRect(body)

                              val screwRadius = 5.dp.toPx()
                              val inset = 13.dp.toPx()
                              drawCircle(detail, screwRadius, Offset(inset, inset))
                              drawCircle(detail, screwRadius, Offset(size.width - inset, inset))
                              drawCircle(detail, screwRadius, Offset(inset, size.height - inset))
                              drawCircle(detail, screwRadius, Offset(size.width - inset, size.height - inset))

                              val grilleRadius = 2.dp.toPx()
                              val grilleGap = 8.dp.toPx()
                              val baseY = size.height - 48.dp.toPx()
                              val baseX =
                                  if (rightSide) {
                                      size.width - 52.dp.toPx()
                                  } else {
                                      20.dp.toPx()
                                  }

                              for (row in 0..3) {
                                  for (col in 0..4) {
                                      drawCircle(
                                          detail,
                                          grilleRadius,
                                          Offset(
                                              baseX + col * grilleGap,
                                              baseY + row * grilleGap,
                                          ),
                                      )
                                  }
                              }

                              if (rightSide) {
                                  val ledY = 23.dp.toPx()
                                  drawCircle(led, 4.dp.toPx(), Offset(size.width * 0.36f, ledY))
                                  drawCircle(detail, 4.dp.toPx(), Offset(size.width * 0.50f, ledY))
                                  drawCircle(detail, 4.dp.toPx(), Offset(size.width * 0.64f, ledY))
                              }
                          }
                          .border(
                              width = 2.dp,
                              color = edge,
                              shape = RoundedCornerShape(10.dp),
                          ),
              )
          }

          @Composable
          private fun PadContainer'''
          if insert_point not in s:
              raise SystemExit("PadContainer insertion point not found")
          s = s.replace(insert_point, hardware_fn, 1)

          p.write_text(s)
          PY

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/Lemuroid
          chmod +x gradlew
          ./gradlew :lemuroid-app:assembleFreeDynamicDebug --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find /tmp/Lemuroid/lemuroid-app/build/outputs/apk -type f -name "*.apk" | head -n 1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/NESMultiplayer-V8-Landscape-Hardware.apk"
          ls -lh "$GITHUB_WORKSPACE/NESMultiplayer-V8-Landscape-Hardware.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NESMultiplayer-V8-Landscape-Hardware
          path: NESMultiplayer-V8-Landscape-Hardware.apk
          if-no-files-found: error
          retention-days: 7
