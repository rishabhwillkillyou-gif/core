name: Build NES V4 Handheld

on:
  workflow_dispatch:
  push:
    branches:
      - nes-emulator-v1-build
    paths:
      - ".github/workflows/nes-v2-turbo-sharp.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout holder repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Clone Lemuroid with submodules
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/Swordfish90/Lemuroid.git /tmp/Lemuroid

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Remove notification onboarding card
        shell: bash
        run: |
          set -euxo pipefail
          HOMEVM=/tmp/Lemuroid/lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/home/HomeViewModel.kt
          sed -i 's/showNoNotificationPermissionCard = !notificationsPermissionEnabled/showNoNotificationPermissionCard = false/' "$HOMEVM"
          grep -n "showNoNotificationPermissionCard" "$HOMEVM"

      - name: Force working FCEUmm turbo
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("/tmp/Lemuroid/lemuroid-app/src/main/java/com/swordfish/lemuroid/app/shared/game/viewmodel/GameViewModelRetroGameView.kt")
          s = p.read_text()

          # Supply working turbo settings from the moment FCEUmm is created.
          old = 'variables = gameData.coreVariables.map { Variable(it.key, it.value) }.toTypedArray()'
          new = '''variables =
                (
                    gameData.coreVariables
                        .filterNot { it.key == "fceumm_turbo_enable" || it.key == "fceumm_turbo_delay" }
                        .map { Variable(it.key, it.value) } +
                        if (system.id == com.swordfish.lemuroid.lib.library.SystemID.NES) {
                            listOf(
                                Variable("fceumm_turbo_enable", "Player 1"),
                                Variable("fceumm_turbo_delay", "2"),
                            )
                        } else {
                            emptyList()
                        }
                ).toTypedArray()'''
          if old not in s:
              raise SystemExit("Initial core variable assignment not found")
          s = s.replace(old, new, 1)

          # Lemuroid reapplies stored core options after startup. Let it do so,
          # then force our NES turbo settings again so "None" cannot overwrite them.
          marker = '        retroGameView?.updateVariables(*updatedVariables)'
          replacement = '''        retroGameView?.updateVariables(*updatedVariables)

        if (system.id == com.swordfish.lemuroid.lib.library.SystemID.NES) {
            retroGameView?.updateVariables(
                Variable("fceumm_turbo_enable", "Player 1"),
                Variable("fceumm_turbo_delay", "2"),
            )
        }'''
          if marker not in s:
              raise SystemExit("Runtime updateVariables call not found")
          s = s.replace(marker, replacement, 1)

          p.write_text(s)
          PY
          grep -n -A8 -B3 "fceumm_turbo_enable" /tmp/Lemuroid/lemuroid-app/src/main/java/com/swordfish/lemuroid/app/shared/game/viewmodel/GameViewModelRetroGameView.kt

      - name: Replace NES controller with handheld layout
        shell: bash
        run: |
          set -euxo pipefail
          cat > /tmp/Lemuroid/lemuroid-touchinput/src/main/java/com/swordfish/touchinput/radial/layouts/NES.kt <<'KOT'
          package com.swordfish.touchinput.radial.layouts

          import android.view.KeyEvent
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.State
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.geometry.Offset
          import com.swordfish.touchinput.radial.controls.LemuroidControlButton
          import com.swordfish.touchinput.radial.controls.LemuroidControlCross
          import com.swordfish.touchinput.radial.controls.LemuroidControlFaceButtons
          import com.swordfish.touchinput.radial.layouts.shared.ComposeTouchLayouts
          import com.swordfish.touchinput.radial.layouts.shared.SecondaryButtonMenu
          import com.swordfish.touchinput.radial.settings.TouchControllerSettingsManager
          import com.swordfish.touchinput.radial.ui.LemuroidButtonForeground
          import gg.padkit.PadKitScope
          import gg.padkit.anchors.Anchor
          import gg.padkit.ids.Id
          import kotlinx.collections.immutable.persistentListOf
          import kotlinx.collections.immutable.persistentMapOf
          import kotlinx.collections.immutable.persistentSetOf

          @Composable
          fun PadKitScope.NESLeft(
              modifier: Modifier = Modifier,
              settings: TouchControllerSettingsManager.Settings,
          ) {
              BaseLayoutLeft(
                  settings = settings,
                  modifier = modifier,
                  primaryDial = {
                      LemuroidControlCross(
                          id = Id.DiscreteDirection(ComposeTouchLayouts.MOTION_SOURCE_DPAD),
                      )
                  },
                  secondaryDials = {
                      LemuroidControlButton(
                          modifier = Modifier.radialPosition(15f).radialScale(0.88f),
                          id = Id.Key(KeyEvent.KEYCODE_BUTTON_SELECT),
                          label = "SELECT",
                      )
                  },
              )
          }

          @Composable
          fun PadKitScope.NESRight(
              modifier: Modifier = Modifier,
              settings: TouchControllerSettingsManager.Settings,
          ) {
              BaseLayoutRight(
                  settings = settings,
                  modifier = modifier,
                  primaryDial = {
                      LemuroidControlFaceButtons(
                          primaryAnchors =
                              persistentListOf(
                                  Anchor(
                                      Offset(1f, 0f),
                                      persistentSetOf(Id.Key(KeyEvent.KEYCODE_BUTTON_A)),
                                      0.38f,
                                  ),
                                  Anchor(
                                      Offset(0f, 1f),
                                      persistentSetOf(Id.Key(KeyEvent.KEYCODE_BUTTON_B)),
                                      0.38f,
                                  ),
                                  Anchor(
                                      Offset(-1f, 0f),
                                      persistentSetOf(Id.Key(KeyEvent.KEYCODE_BUTTON_Y)),
                                      0.38f,
                                  ),
                                  Anchor(
                                      Offset(0f, -1f),
                                      persistentSetOf(Id.Key(KeyEvent.KEYCODE_BUTTON_X)),
                                      0.38f,
                                  ),
                              ),
                          idsForegrounds =
                              persistentMapOf<Id.Key, @Composable (State<Boolean>) -> Unit>(
                                  Id.Key(KeyEvent.KEYCODE_BUTTON_A) to {
                                      LemuroidButtonForeground(pressed = it, label = "A")
                                  },
                                  Id.Key(KeyEvent.KEYCODE_BUTTON_B) to {
                                      LemuroidButtonForeground(pressed = it, label = "B")
                                  },
                                  Id.Key(KeyEvent.KEYCODE_BUTTON_Y) to {
                                      LemuroidButtonForeground(pressed = it, label = "TB")
                                  },
                                  Id.Key(KeyEvent.KEYCODE_BUTTON_X) to {
                                      LemuroidButtonForeground(pressed = it, label = "TA")
                                  },
                              ),
                      )
                  },
                  secondaryDials = {
                      LemuroidControlButton(
                          modifier = Modifier.radialPosition(165f).radialScale(0.88f),
                          id = Id.Key(KeyEvent.KEYCODE_BUTTON_START),
                          label = "START",
                      )
                      SecondaryButtonMenu(settings)
                  },
              )
          }
          KOT

      - name: Add handheld screen bezel and tighten portrait spacing
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("/tmp/Lemuroid/lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/game/GameScreenLayout.kt")
          s = p.read_text()
          s = s.replace(
              'import androidx.constraintlayout.compose.Dimension\n',
              'import androidx.constraintlayout.compose.Dimension\nimport androidx.compose.ui.unit.dp\n'
          )
          s = s.replace(
              'const val CONSTRAINTS_GAME_VIEW = "gameView"\n',
              'const val CONSTRAINTS_GAME_VIEW = "gameView"\n    const val CONSTRAINTS_GAME_BEZEL = "gameBezel"\n'
          )

          old = '''            val gameView = createRefFor(CONSTRAINTS_GAME_VIEW)
            val leftPad = createRefFor(CONSTRAINTS_LEFT_PAD)
            val rightPad = createRefFor(CONSTRAINTS_RIGHT_PAD)
            val gameContainer = createRefFor(CONSTRAINTS_GAME_CONTAINER)
            val bottomContainer = createRefFor(CONSTRAINTS_BOTTOM_CONTAINER)

            val gamePadChain = createHorizontalChain(leftPad, rightPad, chainStyle = ChainStyle.SpreadInside)

            constrain(gameView) {
                width = Dimension.fillToConstraints
                height = Dimension.fillToConstraints
                top.linkTo(parent.top)
                absoluteLeft.linkTo(parent.absoluteLeft)
                absoluteRight.linkTo(parent.absoluteRight)
                bottom.linkTo(leftPad.top)
            }'''
          new = '''            val gameView = createRefFor(CONSTRAINTS_GAME_VIEW)
            val gameBezel = createRefFor(CONSTRAINTS_GAME_BEZEL)
            val leftPad = createRefFor(CONSTRAINTS_LEFT_PAD)
            val rightPad = createRefFor(CONSTRAINTS_RIGHT_PAD)
            val gameContainer = createRefFor(CONSTRAINTS_GAME_CONTAINER)
            val bottomContainer = createRefFor(CONSTRAINTS_BOTTOM_CONTAINER)

            val gamePadChain = createHorizontalChain(leftPad, rightPad, chainStyle = ChainStyle.SpreadInside)

            constrain(gameBezel) {
                width = Dimension.fillToConstraints
                height = Dimension.ratio("6:5")
                top.linkTo(parent.top, margin = 18.dp)
                absoluteLeft.linkTo(parent.absoluteLeft, margin = 10.dp)
                absoluteRight.linkTo(parent.absoluteRight, margin = 10.dp)
            }

            constrain(gameView) {
                width = Dimension.fillToConstraints
                height = Dimension.ratio("4:3")
                top.linkTo(gameBezel.top, margin = 42.dp)
                absoluteLeft.linkTo(gameBezel.absoluteLeft, margin = 22.dp)
                absoluteRight.linkTo(gameBezel.absoluteRight, margin = 22.dp)
            }'''
          if old not in s:
              raise SystemExit("Portrait layout block not found")
          s = s.replace(old, new)

          s = s.replace(
              '''            constrain(rightPad) {
                width = Dimension.fillToConstraints
                bottom.linkTo(parent.bottom)
            }

            constrain(leftPad) {
                width = Dimension.fillToConstraints
                bottom.linkTo(parent.bottom)
            }''',
              '''            constrain(rightPad) {
                width = Dimension.fillToConstraints
                bottom.linkTo(parent.bottom, margin = 36.dp)
            }

            constrain(leftPad) {
                width = Dimension.fillToConstraints
                bottom.linkTo(parent.bottom, margin = 36.dp)
            }'''
          )
          p.write_text(s)

          p = Path("/tmp/Lemuroid/lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/game/MobileGameScreen.kt")
          s = p.read_text()
          s = s.replace(
              'import androidx.compose.foundation.layout.Arrangement\n',
              'import androidx.compose.foundation.background\n'
              'import androidx.compose.foundation.border\n'
              'import androidx.compose.foundation.layout.Arrangement\n'
          )
          s = s.replace(
              'import androidx.compose.ui.graphics.vector.ImageVector\n',
              'import androidx.compose.ui.graphics.Color\n'
              'import androidx.compose.ui.graphics.vector.ImageVector\n'
          )
          s = s.replace(
              'import androidx.compose.ui.unit.dp\n',
              'import androidx.compose.ui.unit.dp\n'
              'import androidx.compose.foundation.shape.RoundedCornerShape\n'
          )

          marker = '''            ConstraintLayout(
                modifier = Modifier.fillMaxSize(),
                constraintSet =
                    GameScreenLayout.buildConstraintSet(
                        isLandscape,
                        currentControllerConfig?.allowTouchOverlay ?: true,
                    ),
            ) {
                Box(
                    modifier =
                        Modifier
                            .layoutId(GameScreenLayout.CONSTRAINTS_GAME_VIEW)'''
          replacement = '''            ConstraintLayout(
                modifier = Modifier.fillMaxSize(),
                constraintSet =
                    GameScreenLayout.buildConstraintSet(
                        isLandscape,
                        currentControllerConfig?.allowTouchOverlay ?: true,
                    ),
            ) {
                if (!isLandscape) {
                    Box(
                        modifier =
                            Modifier
                                .layoutId(GameScreenLayout.CONSTRAINTS_GAME_BEZEL)
                                .background(
                                    color = Color(0xFFB9B9B2),
                                    shape = RoundedCornerShape(28.dp),
                                )
                                .border(
                                    width = 2.dp,
                                    color = Color(0xFF73736F),
                                    shape = RoundedCornerShape(28.dp),
                                ),
                    )
                }

                Box(
                    modifier =
                        Modifier
                            .layoutId(GameScreenLayout.CONSTRAINTS_GAME_VIEW)'''
          if marker not in s:
              raise SystemExit("ConstraintLayout insertion point not found")
          s = s.replace(marker, replacement)
          p.write_text(s)

          p = Path("/tmp/Lemuroid/lemuroid-app/src/main/java/com/swordfish/lemuroid/app/shared/game/ShaderChooser.kt")
          s = p.read_text().replace("SystemID.NES -> ShaderConfig.CRT", "SystemID.NES -> ShaderConfig.Sharp")
          p.write_text(s)
          PY

      - name: Build dynamic debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/Lemuroid
          chmod +x gradlew
          ./gradlew :lemuroid-app:assembleFreeDynamicDebug --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find /tmp/Lemuroid/lemuroid-app/build/outputs/apk -type f -name "*.apk" | head -n 1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/NESMultiplayer-V4-Handheld.apk"
          ls -lh "$GITHUB_WORKSPACE/NESMultiplayer-V4-Handheld.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NESMultiplayer-V4-Handheld
          path: NESMultiplayer-V4-Handheld.apk
          if-no-files-found: error
          retention-days: 7
