name: Build NES V2 Turbo Sharp

on:
  workflow_dispatch:
  push:
    branches:
      - nes-emulator-v1-build
    paths:
      - ".github/workflows/nes-v2-turbo-sharp.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout holder repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Clone Lemuroid with submodules
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/Swordfish90/Lemuroid.git /tmp/Lemuroid

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Add NES turbo buttons
        shell: bash
        run: |
          set -euxo pipefail
          NES=/tmp/Lemuroid/lemuroid-touchinput/src/main/java/com/swordfish/touchinput/radial/layouts/NES.kt
          python3 - <<'PY'
          from pathlib import Path
          p=Path("/tmp/Lemuroid/lemuroid-touchinput/src/main/java/com/swordfish/touchinput/radial/layouts/NES.kt")
          s=p.read_text()
          s=s.replace(
          '''                        Id.Key(KeyEvent.KEYCODE_BUTTON_A),
                          Id.Key(KeyEvent.KEYCODE_BUTTON_B),
                      ),''',
          '''                        Id.Key(KeyEvent.KEYCODE_BUTTON_A),
                          Id.Key(KeyEvent.KEYCODE_BUTTON_B),
                          Id.Key(KeyEvent.KEYCODE_BUTTON_Y),
                          Id.Key(KeyEvent.KEYCODE_BUTTON_X),
                      ),''')
          s=s.replace(
          '''                        Id.Key(KeyEvent.KEYCODE_BUTTON_A) to { LemuroidButtonForeground(pressed = it, label = "A") },
                          Id.Key(KeyEvent.KEYCODE_BUTTON_B) to { LemuroidButtonForeground(pressed = it, label = "B") },
                      ),''',
          '''                        Id.Key(KeyEvent.KEYCODE_BUTTON_A) to { LemuroidButtonForeground(pressed = it, label = "A") },
                          Id.Key(KeyEvent.KEYCODE_BUTTON_B) to { LemuroidButtonForeground(pressed = it, label = "B") },
                          Id.Key(KeyEvent.KEYCODE_BUTTON_Y) to { LemuroidButtonForeground(pressed = it, label = "TB") },
                          Id.Key(KeyEvent.KEYCODE_BUTTON_X) to { LemuroidButtonForeground(pressed = it, label = "TA") },
                      ),''')
          p.write_text(s)
          PY
          grep -n -A25 "LemuroidControlFaceButtons" "$NES"

      - name: Make NES default rendering crisp
        shell: bash
        run: |
          set -euxo pipefail
          SHADER=/tmp/Lemuroid/lemuroid-app/src/main/java/com/swordfish/lemuroid/app/shared/game/ShaderChooser.kt
          sed -i 's/SystemID.NES -> ShaderConfig.CRT/SystemID.NES -> ShaderConfig.Sharp/' "$SHADER"
          grep -n "SystemID.NES" "$SHADER"

      - name: Build dynamic debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/Lemuroid
          chmod +x gradlew
          ./gradlew :lemuroid-app:assembleFreeDynamicDebug --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find /tmp/Lemuroid/lemuroid-app/build/outputs/apk -type f -name "*.apk" | head -n 1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/NESMultiplayer-V2-Turbo-Sharp.apk"
          ls -lh "$GITHUB_WORKSPACE/NESMultiplayer-V2-Turbo-Sharp.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NESMultiplayer-V2-Turbo-Sharp
          path: NESMultiplayer-V2-Turbo-Sharp.apk
          if-no-files-found: error
          retention-days: 7
