name: Build NES V3 Portrait

on:
  workflow_dispatch:
  push:
    branches:
      - nes-emulator-v1-build
    paths:
      - ".github/workflows/nes-v2-turbo-sharp.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout holder repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Clone Lemuroid with submodules
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/Swordfish90/Lemuroid.git /tmp/Lemuroid

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Replace NES touch layout
        shell: bash
        run: |
          set -euxo pipefail
          cat > /tmp/Lemuroid/lemuroid-touchinput/src/main/java/com/swordfish/touchinput/radial/layouts/NES.kt <<'KOT'
          package com.swordfish.touchinput.radial.layouts

          import android.view.KeyEvent
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.State
          import androidx.compose.ui.Modifier
          import com.swordfish.touchinput.radial.controls.LemuroidControlButton
          import com.swordfish.touchinput.radial.controls.LemuroidControlCross
          import com.swordfish.touchinput.radial.controls.LemuroidControlFaceButtons
          import com.swordfish.touchinput.radial.layouts.shared.ComposeTouchLayouts
          import com.swordfish.touchinput.radial.layouts.shared.SecondaryButtonMenu
          import com.swordfish.touchinput.radial.layouts.shared.SecondaryButtonMenuPlaceholder
          import com.swordfish.touchinput.radial.layouts.shared.SecondaryButtonSelect
          import com.swordfish.touchinput.radial.layouts.shared.SecondaryButtonStart
          import com.swordfish.touchinput.radial.settings.TouchControllerSettingsManager
          import com.swordfish.touchinput.radial.ui.LemuroidButtonForeground
          import gg.padkit.PadKitScope
          import gg.padkit.ids.Id
          import kotlinx.collections.immutable.persistentListOf
          import kotlinx.collections.immutable.persistentMapOf

          @Composable
          fun PadKitScope.NESLeft(
              modifier: Modifier = Modifier,
              settings: TouchControllerSettingsManager.Settings,
          ) {
              BaseLayoutLeft(
                  settings = settings,
                  modifier = modifier,
                  primaryDial = { LemuroidControlCross(id = Id.DiscreteDirection(ComposeTouchLayouts.MOTION_SOURCE_DPAD)) },
                  secondaryDials = {
                      SecondaryButtonSelect()
                      SecondaryButtonMenuPlaceholder(settings)
                  },
              )
          }

          @Composable
          fun PadKitScope.NESRight(
              modifier: Modifier = Modifier,
              settings: TouchControllerSettingsManager.Settings,
          ) {
              BaseLayoutRight(
                  settings = settings,
                  modifier = modifier,
                  primaryDial = {
                      LemuroidControlFaceButtons(
                          ids =
                              persistentListOf(
                                  Id.Key(KeyEvent.KEYCODE_BUTTON_A),
                                  Id.Key(KeyEvent.KEYCODE_BUTTON_B),
                              ),
                          idsForegrounds =
                              persistentMapOf<Id.Key, @Composable (State<Boolean>) -> Unit>(
                                  Id.Key(KeyEvent.KEYCODE_BUTTON_A) to { LemuroidButtonForeground(pressed = it, label = "A") },
                                  Id.Key(KeyEvent.KEYCODE_BUTTON_B) to { LemuroidButtonForeground(pressed = it, label = "B") },
                              ),
                      )
                  },
                  secondaryDials = {
                      LemuroidControlButton(
                          modifier = Modifier.radialPosition(118f),
                          id = Id.Key(KeyEvent.KEYCODE_BUTTON_Y),
                          label = "TB",
                      )
                      LemuroidControlButton(
                          modifier = Modifier.radialPosition(158f),
                          id = Id.Key(KeyEvent.KEYCODE_BUTTON_X),
                          label = "TA",
                      )
                      SecondaryButtonStart()
                      SecondaryButtonMenu(settings)
                  },
              )
          }
          KOT

      - name: Label Select and Start
        shell: bash
        run: |
          set -euxo pipefail
          CONTROLS=/tmp/Lemuroid/lemuroid-touchinput/src/main/java/com/swordfish/touchinput/radial/layouts/shared/Controls.kt
          sed -i 's/icon = R.drawable.button_select/label = "SELECT"/' "$CONTROLS"
          sed -i 's/icon = R.drawable.button_start/label = "START"/' "$CONTROLS"

      - name: Move portrait game to top and keep sharp rendering
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("/tmp/Lemuroid/lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/game/GameScreenLayout.kt")
          s = p.read_text()
          old = """            constrain(gameView) {
                          width = Dimension.fillToConstraints
                          height = Dimension.fillToConstraints
                          top.linkTo(parent.top)
                          absoluteLeft.linkTo(parent.absoluteLeft)
                          absoluteRight.linkTo(parent.absoluteRight)
                          bottom.linkTo(leftPad.top)
                      }"""
          new = """            constrain(gameView) {
                          width = Dimension.fillToConstraints
                          height = Dimension.ratio("4:3")
                          top.linkTo(parent.top)
                          absoluteLeft.linkTo(parent.absoluteLeft)
                          absoluteRight.linkTo(parent.absoluteRight)
                      }"""
          if old not in s:
              raise SystemExit("portrait gameView block not found")
          p.write_text(s.replace(old, new))

          p = Path("/tmp/Lemuroid/lemuroid-app/src/main/java/com/swordfish/lemuroid/app/shared/game/ShaderChooser.kt")
          s = p.read_text().replace("SystemID.NES -> ShaderConfig.CRT", "SystemID.NES -> ShaderConfig.Sharp")
          p.write_text(s)
          PY

      - name: Build dynamic debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/Lemuroid
          chmod +x gradlew
          ./gradlew :lemuroid-app:assembleFreeDynamicDebug --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find /tmp/Lemuroid/lemuroid-app/build/outputs/apk -type f -name "*.apk" | head -n 1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/NESMultiplayer-V3-Portrait.apk"
          ls -lh "$GITHUB_WORKSPACE/NESMultiplayer-V3-Portrait.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NESMultiplayer-V3-Portrait
          path: NESMultiplayer-V3-Portrait.apk
          if-no-files-found: error
          retention-days: 7
