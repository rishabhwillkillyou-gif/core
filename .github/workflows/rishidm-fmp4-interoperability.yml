name: RishiDM v0.9.7 Extensionless fMP4 HLS interoperability
on:
  push:
    branches: [rishidm-v097-fmp4-interop]
    paths: ['rishidm/**', '.github/workflows/rishidm-fmp4-interoperability.yml']
  workflow_dispatch:
concurrency:
  group: rishidm-v097-fmp4-interop
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare build tools
        shell: pwsh
        run: |
          python -m pip install 'Pillow==11.3.0'
          if (!(Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis -y --no-progress }
      - name: Compile, HLS/Dropbox/XHR regression tests, package installer
        shell: pwsh
        run: ./rishidm/build-rishidm-v02.ps1
      - name: Verify actual installer payload
        shell: pwsh
        run: |
          7z x rishidm/rishidm-output/RishiDM_Setup_0.9.7_x64.exe -oinstaller-payload -y
          if ($LASTEXITCODE -ne 0) { throw 'Installer extraction failed' }
          $manifest=Get-Content installer-payload/BrowserExtension/Chrome/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne '0.9.7' -or !$manifest.key) { throw 'Incorrect extension payload' }
          foreach ($file in @('RishiDM.exe','RishiDMNativeMessagingHost.exe','RishiDM-v09.ico','VideoTools/yt-dlp.exe','VideoTools/FFmpeg/ffmpeg.exe','VideoTools/deno.exe')) {
            if (!(Test-Path (Join-Path installer-payload $file))) { throw "Missing payload: $file" }
          }
          node rishidm/tests/media-download.cjs installer-payload/VideoTools synthetic-media-test
          if ($LASTEXITCODE -ne 0) { throw 'MPEG-TS HLS download regression failed' }
          node rishidm/tests/media-download-fmp4.cjs installer-payload/VideoTools synthetic-fmp4-test
          if ($LASTEXITCODE -ne 0) { throw 'Extensionless fMP4 HLS end-to-end regression failed' }
      - name: Exercise packaged browser extension in Chromium
        shell: pwsh
        run: |
          npm ci --prefix rishidm/tests --no-audit --no-fund
          node rishidm/tests/node_modules/playwright/cli.js install chromium
          node rishidm/tests/browser-regression.cjs installer-payload/BrowserExtension/Chrome
          if ($LASTEXITCODE -ne 0) { throw 'Chromium regression failed' }
      - name: Hash validated installer
        shell: pwsh
        run: |
          $hash=(Get-FileHash rishidm/rishidm-output/RishiDM_Setup_0.9.7_x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RishiDM_Setup_0.9.7_x64.exe" | Set-Content rishidm/rishidm-output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RishiDM-0.9.7-FMP4-Interoperability
          path: rishidm/rishidm-output/RishiDM_Setup_0.9.7_x64.exe
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RishiDM-0.9.7-FMP4-Interoperability
          path: installer
      - name: Validate and publish experimental release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exe=installer/RishiDM_Setup_0.9.7_x64.exe
          test -f "$exe"
          test "$(stat -c %s "$exe")" -gt 150000000
          test "$(head -c 2 "$exe")" = "MZ"
          (cd installer && sha256sum RishiDM_Setup_0.9.7_x64.exe > SHA256SUMS.txt)
          tag=rishidm-v0.9.7-fmp4-interop-preview
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite.' >&2
            exit 1
          fi
          cat > notes.txt <<'EOF'
          RishiDM v0.9.7 — extensionless fMP4/HLS interoperability preview.

          - Fix standard, unencrypted public HLS media playlists using EXT-X-MAP
            with segment URIs that do not end in .ts, .m4s or .mp4.
          - Restrict the new inference to playlists whose every fragment is
            extensionless and whose initialization section uses MP4 format.
          - No new authentication, cookies, token reuse, DRM or protected access
            handling. HTTP 403/404 manifest failures remain unsupported.
          - Retains v0.9.6 XHR classification, v0.9.5 Dropbox fallback,
            normal downloads, YouTube/Instagram, branding and desktop UI.
          - Regression tests cover public/redirected/encrypted HLS, MIME-only
            playlists, extensionless fMP4, rejected encrypted/unknown-map/no-map
            variants, packaged Chromium integration and actual synthetic HLS
            download/decoding with bundled yt-dlp/FFmpeg (TS and fMP4).

          Known limitations:
          - This is NOT a verified AutoEmbed fix. Validated only on local,
            authorized synthetic HLS media, not the protected third-party site.
          - Unsigned experimental installer. Keep v0.9.6 for rollback.
          EOF
          gh release create "$tag" "$exe" installer/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target rishidm-v097-fmp4-interop \
            --title "RishiDM v0.9.7 — Extensionless fMP4 HLS Preview" \
            --prerelease --notes-file notes.txt
