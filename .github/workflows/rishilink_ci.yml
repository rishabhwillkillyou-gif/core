name: RishiLink v0.1 CI

on:
  push:
    branches:
      - rishilink-ci
    paths:
      - ".github/workflows/rishilink_ci.yml"
      - "rishilink_ci/**"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"
  LOCALSEND_COMMIT: "230fb692962668ca22ce0e61a8f53ce1cfd32102"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout RishiLink CI carrier
        uses: actions/checkout@v6

      - name: Clone pinned LocalSend base
        run: |
          git clone https://github.com/localsend/localsend.git rishilink-src
          git -C rishilink-src checkout "$LOCALSEND_COMMIT"

      - name: Apply RishiLink changes
        run: python rishilink_ci/patch_rishilink.py rishilink-src

      - name: Remove proprietary dependencies
        working-directory: rishilink-src
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Resolve dependencies
        working-directory: rishilink-src/app
        run: flutter pub get

      - name: Static analysis
        working-directory: rishilink-src/app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build Android debug APKs
        working-directory: rishilink-src/app
        run: flutter build apk --debug --split-per-abi

      - name: Upload Android APKs
        uses: actions/upload-artifact@v6
        with:
          name: RishiLink-v0.1-Android-debug
          path: |
            rishilink-src/app/build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
            rishilink-src/app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
            rishilink-src/app/build/app/outputs/flutter-apk/app-x86_64-debug.apk
          if-no-files-found: error

  windows:
    name: Windows portable
    runs-on: windows-latest
    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - name: Checkout RishiLink CI carrier
        uses: actions/checkout@v6

      - name: Clone pinned LocalSend base
        shell: pwsh
        run: |
          git clone https://github.com/localsend/localsend.git rishilink-src
          git -C rishilink-src checkout "$env:LOCALSEND_COMMIT"

      - name: Apply RishiLink changes
        run: python rishilink_ci/patch_rishilink.py rishilink-src

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Build MSIX helper dependency
        shell: pwsh
        working-directory: rishilink-src
        run: |
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makepri.exe' | Select-Object -Last 1
          & $makepri.FullName new /pr support\build\msix\content /cf support\build\msix\priconfig.xml /mn support\build\msix\content\AppxManifest.xml /of support\build\msix\content\resources.pri /o
          & 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe' pack /o /d support\build\msix\content /nv /p app\windows\localsend_msix_helper.msix

      - name: Resolve dependencies
        working-directory: rishilink-src/app
        run: flutter pub get

      - name: Static analysis
        working-directory: rishilink-src/app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build Windows
        working-directory: rishilink-src/app
        run: flutter build windows

      - name: Package portable build
        shell: pwsh
        run: Compress-Archive -Path rishilink-src\app\build\windows\x64\runner\Release\* -DestinationPath RishiLink-v0.1-windows-x64.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: RishiLink-v0.1-Windows-x64
          path: RishiLink-v0.1-windows-x64.zip
          if-no-files-found: error
