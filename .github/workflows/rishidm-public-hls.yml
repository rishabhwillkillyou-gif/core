name: RishiDM public HLS fix validation
on:
  push:
    branches: [codex/public-hls-request-fix]
    paths: ['rishidm/**', '.github/workflows/rishidm-public-hls.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare packaging
        shell: pwsh
        run: |
          python -m pip install 'Pillow==11.3.0'
          if (!(Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis -y --no-progress }
      - name: Compile, regression test and package
        shell: pwsh
        run: ./rishidm/build-rishidm-v02.ps1
      - name: Extract and verify the actual installer payload
        shell: pwsh
        run: |
          7z x rishidm/rishidm-output/RishiDM_Setup_0.9.4_x64.exe -oinstaller-payload -y
          if ($LASTEXITCODE -ne 0) { throw 'Installer extraction failed' }
          $manifest=Get-Content installer-payload/BrowserExtension/Chrome/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne '0.9.4' -or !$manifest.key) { throw 'Incorrect packaged extension' }
          foreach ($file in @('RishiDM.exe','RishiDMNativeMessagingHost.exe','RishiDM-v09.ico','VideoTools/yt-dlp.exe','VideoTools/FFmpeg/ffmpeg.exe','VideoTools/deno.exe')) {
            if (!(Test-Path (Join-Path installer-payload $file))) { throw "Missing payload: $file" }
          }
          node rishidm/tests/media-download.cjs installer-payload/VideoTools synthetic-media-test
          if ($LASTEXITCODE -ne 0) { throw 'Packaged media download failed' }
      - name: Exercise packaged extension in isolated Chromium
        shell: pwsh
        run: |
          npm ci --prefix rishidm/tests --no-audit --no-fund
          node rishidm/tests/node_modules/playwright/cli.js install chromium
          node rishidm/tests/browser-regression.cjs installer-payload/BrowserExtension/Chrome
          if ($LASTEXITCODE -ne 0) { throw 'Packaged browser regression failed' }
      - name: Hash validated installer
        shell: pwsh
        run: |
          $hash=(Get-FileHash rishidm/rishidm-output/RishiDM_Setup_0.9.4_x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RishiDM_Setup_0.9.4_x64.exe" | Set-Content rishidm/rishidm-output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RishiDM-0.9.4-validated-public-HLS
          path: rishidm/rishidm-output/*
          if-no-files-found: error
          retention-days: 30
