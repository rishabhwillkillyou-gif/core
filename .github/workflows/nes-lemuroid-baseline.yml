name: Build NES Lemuroid Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - nes-emulator-v1-build
    paths:
      - ".github/workflows/nes-lemuroid-baseline.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout holder repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Clone Lemuroid with submodules
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/Swordfish90/Lemuroid.git /tmp/Lemuroid
          cd /tmp/Lemuroid
          git submodule status

      - name: Install required Android SDK/NDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" || true

      - name: Brand baseline
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/Lemuroid
          # Keep the proven Lemuroid runtime intact. Only alter the visible debug app name.
          find lemuroid-app/src -type f \( -name "*.xml" -o -name "*.kt" \) -print0 | xargs -0 sed -i 's/Lemuroid/NES Multiplayer Core Test/g' || true

      - name: Build bundled debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/Lemuroid
          chmod +x gradlew
          ./gradlew :lemuroid-app:assembleFreeBundleDebug --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find /tmp/Lemuroid/lemuroid-app/build/outputs/apk -type f -name "*.apk" | head -n 1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/NESMultiplayer-Lemuroid-Baseline.apk"
          ls -lh "$GITHUB_WORKSPACE/NESMultiplayer-Lemuroid-Baseline.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NESMultiplayer-Lemuroid-Baseline
          path: NESMultiplayer-Lemuroid-Baseline.apk
          if-no-files-found: error
          retention-days: 7
