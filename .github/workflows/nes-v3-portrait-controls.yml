name: Build NES V3 Portrait Controls

on:
  workflow_dispatch:
  push:
    branches:
      - nes-emulator-v1-build
    paths:
      - ".github/workflows/nes-v3-portrait-controls.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout holder repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Clone Lemuroid
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/Swordfish90/Lemuroid.git /tmp/Lemuroid

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Patch NES portrait controls and screen position
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("/tmp/Lemuroid")

          # 1) Keep only A/B in the main face-button cluster and add
          # clearly visible TA/TB as dedicated secondary controls.
          p = root / "lemuroid-touchinput/src/main/java/com/swordfish/touchinput/radial/layouts/NES.kt"
          s = p.read_text()

          s = s.replace(
              "import com.swordfish.touchinput.radial.controls.LemuroidControlFaceButtons\n",
              "import com.swordfish.touchinput.radial.controls.LemuroidControlFaceButtons\n"
              "import com.swordfish.touchinput.radial.controls.LemuroidControlButton\n"
          )

          old_right = '''        secondaryDials = {
            SecondaryButtonStart()
            SecondaryButtonMenu(settings)
        },'''
          new_right = '''        secondaryDials = {
            LemuroidControlButton(
                modifier = Modifier.radialPosition(120f),
                id = Id.Key(KeyEvent.KEYCODE_BUTTON_Y),
                label = "TB",
            )
            LemuroidControlButton(
                modifier = Modifier.radialPosition(150f),
                id = Id.Key(KeyEvent.KEYCODE_BUTTON_X),
                label = "TA",
            )
            SecondaryButtonStart()
            SecondaryButtonMenu(settings)
        },'''
          if old_right not in s:
              raise SystemExit("NES right secondary block not found")
          s = s.replace(old_right, new_right)
          p.write_text(s)

          # 2) Make SELECT / START text labels instead of cryptic icons.
          p = root / "lemuroid-touchinput/src/main/java/com/swordfish/touchinput/radial/layouts/shared/Controls.kt"
          s = p.read_text()
          s = s.replace(
              '''        id = Id.Key(KeyEvent.KEYCODE_BUTTON_SELECT),
        icon = R.drawable.button_select,''',
              '''        id = Id.Key(KeyEvent.KEYCODE_BUTTON_SELECT),
        label = "SELECT",'''
          )
          s = s.replace(
              '''        id = Id.Key(KeyEvent.KEYCODE_BUTTON_START),
        icon = R.drawable.button_start,''',
              '''        id = Id.Key(KeyEvent.KEYCODE_BUTTON_START),
        label = "START",'''
          )
          p.write_text(s)

          # 3) Portrait game area: actual 4:3 surface pinned to the top.
          # This prevents the NES image being vertically centred inside a
          # huge tall black rendering area.
          p = root / "lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/game/GameScreenLayout.kt"
          s = p.read_text()
          old = '''            constrain(gameView) {
                width = Dimension.fillToConstraints
                height = Dimension.fillToConstraints
                top.linkTo(parent.top)
                absoluteLeft.linkTo(parent.absoluteLeft)
                absoluteRight.linkTo(parent.absoluteRight)
                bottom.linkTo(leftPad.top)
            }'''
          new = '''            constrain(gameView) {
                width = Dimension.fillToConstraints
                height = Dimension.ratio("4:3")
                top.linkTo(parent.top)
                absoluteLeft.linkTo(parent.absoluteLeft)
                absoluteRight.linkTo(parent.absoluteRight)
            }'''
          if old not in s:
              raise SystemExit("Portrait gameView constraint block not found")
          s = s.replace(old, new)
          p.write_text(s)

          # 4) Keep sharp rendering as default for NES.
          p = root / "lemuroid-app/src/main/java/com/swordfish/lemuroid/app/shared/game/ShaderChooser.kt"
          s = p.read_text().replace(
              "SystemID.NES -> ShaderConfig.CRT",
              "SystemID.NES -> ShaderConfig.Sharp"
          )
          p.write_text(s)
          PY

          echo "=== NES layout ==="
          sed -n '1,140p' /tmp/Lemuroid/lemuroid-touchinput/src/main/java/com/swordfish/touchinput/radial/layouts/NES.kt
          echo "=== Portrait constraints ==="
          sed -n '20,85p' /tmp/Lemuroid/lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/game/GameScreenLayout.kt

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/Lemuroid
          chmod +x gradlew
          ./gradlew :lemuroid-app:assembleFreeDynamicDebug --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find /tmp/Lemuroid/lemuroid-app/build/outputs/apk -type f -name "*.apk" | head -n 1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/NESMultiplayer-V3-Portrait.apk"
          ls -lh "$GITHUB_WORKSPACE/NESMultiplayer-V3-Portrait.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NESMultiplayer-V3-Portrait
          path: NESMultiplayer-V3-Portrait.apk
          if-no-files-found: error
          retention-days: 7
