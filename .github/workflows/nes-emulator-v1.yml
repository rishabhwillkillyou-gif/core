name: Build NES Emulator V1

on:
  push:
    branches:
      - nes-emulator-v1-build
    paths:
      - "nes-ci/**"
      - ".github/workflows/nes-emulator-v1.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify and install Android SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Reconstruct NES source package
        shell: bash
        run: |
          set -euxo pipefail
          cat nes-ci/source.part-* > /tmp/NESMultiplayerV1-source.zip.b64
          base64 --decode /tmp/NESMultiplayerV1-source.zip.b64 > /tmp/NESMultiplayerV1-source.zip
          mkdir -p /tmp/nes-source
          unzip -q /tmp/NESMultiplayerV1-source.zip -d /tmp/nes-source
          test -f /tmp/nes-source/NESMultiplayerV1/app/build.gradle.kts
          test -f /tmp/nes-source/NESMultiplayerV1/app/src/main/java/com/rishabh/nesv1/ui/GameActivity.kt

      - name: Patch emulator launch path for V1.1
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("/tmp/nes-source/NESMultiplayerV1/app/src/main/java/com/rishabh/nesv1/ui/GameActivity.kt")
          s = p.read_text()

          s = s.replace(
              'import androidx.appcompat.app.AppCompatActivity\n',
              'import androidx.appcompat.app.AppCompatActivity\nimport androidx.lifecycle.lifecycleScope\nimport kotlinx.coroutines.launch\n'
          )

          s = s.replace(
              'storage = GameStorage(this, romBytes)\n        root = FrameLayout(this).apply { setBackgroundColor(Color.BLACK) }',
              '''storage = GameStorage(this, romBytes)

        val privateRom = java.io.File(filesDir, "roms/${storage.gameId}.nes").apply {
            parentFile?.mkdirs()
            if (!exists() || length() != romBytes.size.toLong()) {
                writeBytes(romBytes)
            }
        }

        root = FrameLayout(this).apply { setBackgroundColor(Color.BLACK) }'''
          )

          s = s.replace(
              'coreFilePath = "libfceumm_libretro_android.so"\n            gameFileBytes = romBytes',
              '''coreFilePath = java.io.File(
                applicationInfo.nativeLibraryDir,
                "libfceumm_libretro_android.so"
            ).absolutePath
            gameFilePath = privateRom.absolutePath'''
          )

          s = s.replace(
              'lifecycle.addObserver(retroView)\n    }',
              '''lifecycle.addObserver(retroView)

        lifecycleScope.launch {
            retroView.getGLRetroErrors().collect { errorCode ->
                val message = when (errorCode) {
                    GLRetroView.ERROR_LOAD_LIBRARY -> "NES core failed to load"
                    GLRetroView.ERROR_LOAD_GAME -> "ROM could not be loaded"
                    GLRetroView.ERROR_GL_NOT_COMPATIBLE -> "Graphics initialization failed"
                    GLRetroView.ERROR_SERIALIZATION -> "Save-state error"
                    else -> "Emulator error (code $errorCode)"
                }
                Toast.makeText(this@GameActivity, message, Toast.LENGTH_LONG).show()
            }
        }
    }'''
          )

          p.write_text(s)
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/nes-source/NESMultiplayerV1
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          cp /tmp/nes-source/NESMultiplayerV1/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/NESMultiplayer-V1.1-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/NESMultiplayer-V1-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NESMultiplayer-V1.1-debug-apk
          path: NESMultiplayer-V1-debug.apk
          if-no-files-found: error
          retention-days: 7
