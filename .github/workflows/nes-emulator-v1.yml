name: Build NES Emulator V1

on:
  push:
    branches:
      - nes-emulator-v1-build
    paths:
      - "nes-ci/**"
      - ".github/workflows/nes-emulator-v1.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify and install Android SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Reconstruct NES source package
        shell: bash
        run: |
          set -euxo pipefail
          cat nes-ci/source.part-* > /tmp/NESMultiplayerV1-source.zip.b64
          base64 --decode /tmp/NESMultiplayerV1-source.zip.b64 > /tmp/NESMultiplayerV1-source.zip
          mkdir -p /tmp/nes-source
          unzip -q /tmp/NESMultiplayerV1-source.zip -d /tmp/nes-source
          test -f /tmp/nes-source/NESMultiplayerV1/app/build.gradle.kts
          test -f /tmp/nes-source/NESMultiplayerV1/app/src/main/java/com/rishabh/nesv1/ui/GameActivity.kt

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/nes-source/NESMultiplayerV1
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          cp /tmp/nes-source/NESMultiplayerV1/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/NESMultiplayer-V1-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/NESMultiplayer-V1-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NESMultiplayer-V1-debug-apk
          path: NESMultiplayer-V1-debug.apk
          if-no-files-found: error
          retention-days: 7
