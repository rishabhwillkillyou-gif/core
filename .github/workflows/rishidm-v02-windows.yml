name: RishiDM v0.7 Visual Identity Preview

on:
  push:
    branches: [rishidm-v07-polish-diagnostics]
    paths:
      - 'rishidm/**'
      - '.github/workflows/rishidm-v02-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout RishiDM development branch
        uses: actions/checkout@v4
      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '25'
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python with deterministic icon rendering
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow for original RishiDM icon generation
        shell: pwsh
        run: |
          python -m pip install 'Pillow==11.3.0'
      - name: Verify brand generator syntax
        shell: pwsh
        run: python -m py_compile rishidm/branding/generate_brand_assets.py
      - name: Check NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis -y --no-progress
          }
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            throw 'NSIS is required to generate the Windows installer'
          }
      - name: Compile and package RishiDM v0.7
        shell: pwsh
        run: ./rishidm/build-rishidm-v02.ps1
      - name: Upload RishiDM EXE
        uses: actions/upload-artifact@v4
        with:
          name: RishiDM-v0.7-Brand-Preview
          path: rishidm/rishidm-output/RishiDM_Setup_0.7.0_x64.exe
          retention-days: 30
          if-no-files-found: error
