name: RishiDM v0.9.3 HLS Failure Diagnostics Preview

on:
  push:
    branches: [rishidm-v093-hls-failure-diagnostics]
    paths:
      - 'rishidm/**'
      - '.github/workflows/rishidm-v02-windows.yml'
  workflow_dispatch:

concurrency:
  group: rishidm-v093-hls-failure-diagnostics-preview
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout RishiDM development branch
        uses: actions/checkout@v4
      - name: Install JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python with deterministic icon rendering
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow for original RishiDM icon generation
        shell: pwsh
        run: |
          python -m pip install 'Pillow==11.3.0'
      - name: Verify brand generator syntax
        shell: pwsh
        run: python -m py_compile rishidm/branding/generate_brand_assets.py
      - name: Check NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis -y --no-progress
          }
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            throw 'NSIS is required to generate the Windows installer'
          }
      - name: Compile and package RishiDM v0.9.3
        shell: pwsh
        run: ./rishidm/build-rishidm-v02.ps1
      - name: Upload RishiDM EXE
        uses: actions/upload-artifact@v4
        with:
          name: RishiDM-v0.9.3-HLS-Failure
          path: rishidm/rishidm-output/RishiDM_Setup_0.9.3_x64.exe
          retention-days: 30
          if-no-files-found: error

  publish-preview:
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the successful Windows installer
        uses: actions/download-artifact@v4
        with:
          name: RishiDM-v0.9.3-HLS-Failure
          path: installer
      - name: Validate installer signature and prepare checksums
        shell: bash
        run: |
          set -euo pipefail
          exe=installer/RishiDM_Setup_0.9.3_x64.exe
          test -f "$exe"
          test "$(stat -c %s "$exe")" -gt 150000000
          test "$(head -c 2 "$exe")" = "MZ"
          (cd installer && sha256sum RishiDM_Setup_0.9.3_x64.exe > SHA256SUMS.txt)
      - name: Publish clearly labeled experimental prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=rishidm-v0.9.3-hls-diagnostics-preview
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Preview already published; refusing to overwrite it."
            exit 0
          fi
          cat > notes.txt <<'EOF'
          RishiDM v0.9.3 experimental media pipeline diagnostics.

          - Extension popup shows sanitized per-tab media response counts, request-type and HLS URL-pattern evidence, and media-pipeline stage counters.
          - Refresh and Copy sanitized diagnostics; no full URLs, cookies, signed tokens or authorization headers in report.
          - Clarifies observed network responses versus actual registry events, without fetching additional stream content.
          - Adds HLS manifest fetch/HTTP-status/content-type/parse/segment/encryption failure reason counters; only sanitized reason counts are copied.
          - Generic watch-page URLs are no longer blindly passed to the native video helper.
          - Known supported extractor sites and eligible non-credentialed HTTP/HLS sources remain usable.
          - v0.9 native desktop UI, download queue and RishiDM icon are retained.

          LIMITATIONS:
          - AutoEmbed playback may still not yield an authorized, unprotected independent download.
          - The existence of video traffic does not prove a supported downloadable source.
          - Experimental unsigned Windows x64 installer; keep your v0.9 installer for rollback.
          - Close RishiDM and browser processes before updating the unpacked extension.
          - Browser-extension UI and runtime detection require hands-on Windows/Chrome testing.
          - No DRM bypass, cookie extraction or license decryption.
          EOF
          gh release create "$tag" \
            installer/RishiDM_Setup_0.9.3_x64.exe installer/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target rishidm-v093-hls-failure-diagnostics \
            --title "RishiDM v0.9.3 — HLS Failure Diagnostics" \
            --prerelease --notes-file notes.txt
